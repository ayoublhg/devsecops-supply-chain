name: DevSecOps Supply Chain Pipeline

on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

permissions:
  contents: read
  packages: write
  security-events: write
  actions: read
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/juice-shop

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
      - uses: docker/build-push-action@v5
        id: build
        with:
          context: ./app
          push: true
          tags: ${{ steps.meta.outputs.tags }}
      - name: Generate SBOM with Syft (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cyclonedx.json

  sast-scan:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - uses: actions/checkout@v4
      - name: Install Semgrep
        run: pip install semgrep
      - name: Run Semgrep SAST (Full Rules)
        run: |
          # We allow failure here so we can run the fallback check
          semgrep scan \
            --config=./security/sast/rules/custom-sqli.yaml \
            --config=p/security-audit \
            --config=p/owasp-top-ten \
            --config=p/secrets \
            --severity=WARNING \
            --verbose \
            ./app || true
            
      - name: Fallback Security Check (Fail Closed)
        run: |
          echo "Checking if vulnerable code was missed by Semgrep..."
          if grep -rnw './app' -e 'req.query'; then
            echo "❌ FATAL: SQL Injection detected in the code!"
            echo "The SAST Gate has blocked this deployment."
            exit 1
          else
            echo "✅ No vulnerabilities found."
          fi

  sca-scan:
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy SCA (filesystem)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table' # CHANGED FROM SARIF TO TABLE
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true

  secret-scan:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image-scan:
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy image scan (Gate 3)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ needs.build-and-push.outputs.image }}@${{ needs.build-and-push.outputs.digest }}
          format: 'table'
          severity: 'CRITICAL'
          exit-code: '1'
          ignore-unfixed: true
          trivyignores: '.trivyignore'

  sign-image:
    runs-on: ubuntu-latest
    needs: [build-and-push, sast-scan, sca-scan, secret-scan, image-scan]
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Sign the image (keyless, GitHub OIDC)
        run: |
          cosign sign --yes \
            ${{ needs.build-and-push.outputs.image }}@${{ needs.build-and-push.outputs.digest }}

  attest-sbom:
    runs-on: ubuntu-latest
    needs: [build-and-push, sign-image]
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Download SBOM artifact
        uses: actions/download-artifact@v4
        with:
          name: sbom
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Attest SBOM to the image
        run: |
          cosign attest --yes \
            --predicate sbom.cyclonedx.json \
            --type cyclonedx \
            ${{ needs.build-and-push.outputs.image }}@${{ needs.build-and-push.outputs.digest }}

  verify-signature:
    runs-on: ubuntu-latest
    needs: [build-and-push, sign-image]
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
      - name: Verify the image signature (Gate CD)
        run: |
          cosign verify \
            --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
            --certificate-identity-regexp="https://github.com/${{ github.repository }}/.github/workflows/.*" \
            ${{ needs.build-and-push.outputs.image }}@${{ needs.build-and-push.outputs.digest }}
