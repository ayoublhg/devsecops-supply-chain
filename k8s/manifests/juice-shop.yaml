apiVersion: apps/v1
kind: Deployment
metadata:
  name: juice-shop
  labels: { app: juice-shop }
spec:
  replicas: 1
  selector: { matchLabels: { app: juice-shop } }
  template:
    metadata: { labels: { app: juice-shop } }
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: juice-shop
          image: ghcr.io/ayoublhg/devsecops-supply-chain/juice-shop:main
          ports: [{ containerPort: 3000 }]
          resources:
            requests: { memory: "256Mi", cpu: "250m" }
            limits:   { memory: "512Mi", cpu: "500m" }
---
apiVersion: v1
kind: Service
metadata: { name: juice-shop }
spec:
  selector: { app: juice-shop }
  ports: [{ port: 80, targetPort: 3000 }]
  type: ClusterIP