rules:
  - id: custom-sql-injection
    languages: [javascript, typescript]
    message: |
      SQL Injection: user input is concatenated into a SQL query.
      Use parameterized queries instead.
    severity: ERROR
    patterns:
      - pattern-either:
          - pattern: |
              $CONN.query("..." + $REQ.query..., ...)
          - pattern: |
              $CONN.query($REQ.query..., ...)
          - pattern: |
              $STR = "..." + $REQ.query...
              ...
              $CONN.query($STR, ...)
